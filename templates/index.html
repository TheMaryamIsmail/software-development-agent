<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Jinja2 Variable Injection -->
    <title>{{ title }}</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --success-color: #22c55e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        textarea {
            width: 100%;
            height: 100px;
            background-color: #0f172a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            font-size: 1rem;
            resize: vertical;
            box-sizing: border-box;
        }
        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            background-color: #64748b;
            cursor: not-allowed;
        }
        .loader {
            display: none;
            margin-left: 10px;
            vertical-align: middle;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background-color: #334155;
            color: var(--text-color);
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 0;
        }
        .tab-btn.active {
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
        }
        pre {
            background-color: #090d16;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            border: 1px solid var(--border-color);
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            max-height: 500px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>{{ title }}</h1>
            <p>Powered by CrewAI, FastAPI, and Jinja2</p>
        </header>

        <div class="card">
            <h3>Enter Software Requirement</h3>
            <textarea id="requirementInput" placeholder="e.g., Build a command-line Todo application with JSON persistence and priority management."></textarea>
            <div style="display: flex; align-items: center;">
                <button id="runBtn" onclick="runWorkflow()">Run Development Crew</button>
                <div id="loader" class="loader"></div>
            </div>
        </div>

        <div id="resultsCard" class="card hidden">
            <h3>Generated Artifacts</h3>
            <div class="tabs" id="tabContainer"></div>
            <div id="contentContainer"></div>
        </div>
    </div>

    <script>
        let currentArtifacts = {};

        async function runWorkflow() {
            const requirement = document.getElementById('requirementInput').value.trim();
            if (!requirement) {
                alert('Please enter a software requirement.');
                return;
            }

            const runBtn = document.getElementById('runBtn');
            const loader = document.getElementById('loader');
            const resultsCard = document.getElementById('resultsCard');

            runBtn.disabled = true;
            loader.style.display = 'inline-block';
            resultsCard.classList.add('hidden');

            try {
                const response = await fetch('/api/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ requirement })
                });
                const data = await response.json();

                if (data.success) {
                    currentArtifacts = data.artifacts;
                    renderTabs();
                    resultsCard.classList.remove('hidden');
                } else {
                    alert('Error: ' + (data.detail || data.error));
                }
            } catch (err) {
                alert('An error occurred while communicating with the server.');
                console.error(err);
            } finally {
                runBtn.disabled = false;
                loader.style.display = 'none';
            }
        }

        function renderTabs() {
            const tabContainer = document.getElementById('tabContainer');
            const contentContainer = document.getElementById('contentContainer');
            tabContainer.innerHTML = '';
            contentContainer.innerHTML = '';

            const keys = Object.keys(currentArtifacts);
            if (keys.length === 0) {
                contentContainer.innerHTML = '<p>No artifacts generated.</p>';
                return;
            }

            keys.forEach((filename, index) => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (index === 0 ? ' active' : '');
                btn.innerText = filename;
                btn.onclick = () => switchTab(filename);
                tabContainer.appendChild(btn);

                const pre = document.createElement('pre');
                pre.id = `content-${filename}`;
                pre.className = index === 0 ? '' : 'hidden';
                pre.innerText = currentArtifacts[filename];
                contentContainer.appendChild(pre);
            });
        }

        function switchTab(filename) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.innerText === filename) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            Object.keys(currentArtifacts).forEach(file => {
                const pre = document.getElementById(`content-${file}`);
                if (file === filename) {
                    pre.classList.remove('hidden');
                } else {
                    pre.classList.add('hidden');
                }
            });
        }
    </script>
</body>
</html>
